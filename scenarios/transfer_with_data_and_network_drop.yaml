name: transfer_with_data_and_network_drop
description: >
  One full PC-to-PC migration, end to end, driven entirely from this file:
    1. Each PC seeds its own migration test data first (testdata/seed_*.ps1) -- the Source
       lays down everything to be migrated plus the edge/permission cases, the Target lays
       down the pre-existing/colliding data. All seeding input (profile, counts, etc.) is
       in the `args:` of the seed_*_data steps below.
    2. Sign in, pair, and start a single transfer of everything.
    3. Mid-transfer the TARGET drops and restores its own network adapter SIX times
       (disable_network / enable_network), each time waiting for the no-network overlay and
       then for the transfer to resume on its own before the next drop.
    4. The run finishes, validates the migration report against this PC, and tears down:
       the seeded data is removed (clean_test_data) and the network is restored.

  Both PCs run the resource benchmark sampler for the whole run (start_benchmark /
  stop_benchmark_report) -- a per-role report lands in benchmark/output/<run_id>/.

  Needs an ELEVATED run on both PCs (network adapter + seeding). DDA_NETWORK_ADAPTER_NAME
  may be set to pick the adapter. To change the data volume, edit the seed step args
  (profile: Minimal | Standard | Stress) -- keep the two roles' profiles the same so the
  conflict / identical / same-folder cases line up. Based on network_drop_target.yaml.
launch: exe
roles:
  target:
    defaults: {step_timeout: 300, tick: 0.5}
    policies: {base: happy_path}
    setup: [start_benchmark]
    teardown: [enable_network, clean_test_data, stop_benchmark_report]
    steps:
      - at: [welcome, welcomeSignedOut]
        env: seed_target_data
        args: {profile: Standard, script_timeout: 1800}
        timeout: 1800
        note: >
          lay down the Target's pre-existing/colliding data before anything else. The
          Target has only the fixed collision files (no bulk data), so seed_target.ps1
          accepts only profile and dry_run -- the volume args (many_small_count,
          big_file_mb) apply to seed_source_data, not here.
      - at: [welcome, welcomeSignedOut]
        do: continue
        timeout: 120
      - at: signIn
        do: sign_in
        optional: true
        timeout: 300
        note: skipped when a cached login goes straight to checkPrerequisites; UAC is approved by hand
      - at: connectOldPc
        do: publish
        args: {value: connectOldPc}
        optional: true
        timeout: 900
      - at: enterCode
        do: type_code
        args: {timeout: 600, attempts: 5, confirm_timeout: 30}
        timeout: 900
      - at: chooseWhatToMove
        do: migrate_now
        timeout: 600
      - at: migrating
        do: publish
        args: {value: migrating}
        timeout: 180
      # Six disconnect/reconnect cycles, all mid-transfer (6 drops, 5 gaps between them).
      # Each: wait into the transfer, drop the adapter, wait for the no-network overlay,
      # bring it back, and let the transfer resume. The 10 GB file keeps the transfer
      # running long enough for all six; wait_before controls the spacing between drops.
      # --- cycle 1 of 6 ---
      - at: migrating
        env: disable_network
        wait_before: 30
        note: network drop "in between" -- wait_before is how long into the transfer it happens
      - at: noNetwork
        timeout: 180
        note: the no-network overlay must appear after the adapter goes down
      - at: noNetwork
        env: enable_network
        wait_before: 20
      - at: migrating
        timeout: 600
        note: the overlay must clear by itself once the engine reports the network back
      # --- cycle 2 of 6 ---
      - at: migrating
        env: disable_network
        wait_before: 30
      - at: noNetwork
        timeout: 180
      - at: noNetwork
        env: enable_network
        wait_before: 20
      - at: migrating
        timeout: 600
      # --- cycle 3 of 6 ---
      - at: migrating
        env: disable_network
        wait_before: 30
      - at: noNetwork
        timeout: 180
      - at: noNetwork
        env: enable_network
        wait_before: 20
      - at: migrating
        timeout: 600
      # --- cycle 4 of 6 ---
      - at: migrating
        env: disable_network
        wait_before: 30
      - at: noNetwork
        timeout: 180
      - at: noNetwork
        env: enable_network
        wait_before: 20
      - at: migrating
        timeout: 600
      # --- cycle 5 of 6 ---
      - at: migrating
        env: disable_network
        wait_before: 30
      - at: noNetwork
        timeout: 180
      - at: noNetwork
        env: enable_network
        wait_before: 20
      - at: migrating
        timeout: 600
      # --- cycle 6 of 6 ---
      - at: migrating
        env: disable_network
        wait_before: 30
      - at: noNetwork
        timeout: 180
      - at: noNetwork
        env: enable_network
        wait_before: 20
      - at: migrating
        timeout: 600
      - at: resultsSummary
        timeout: 21600
        note: up to 6h -- a large transfer (e.g. the 10 GB file) can take a long time to complete
      - at: resultsSummary
        do: finish
      - at: migrationDone
        do: download_pdf
      - at: migrationDone
        env: validate_migration_report
        note: validation/validate_migration.py against the newest report -- fails the run on a mismatch
      - at: migrationDone
        env: check_permissions
        args: {fetch_timeout: 300, fail_on_change: true}
        note: >
          fetches the Source manifest from the Coordination Service and runs
          testdata/check_permissions.ps1 against the migrated files on this PC -- fails the
          run if any permission was not retained. Set fail_on_change: false to only report.
      - at: migrationDone
        env: check_collisions
        args: {fetch_timeout: 300, fail_on_change: true}
        note: >
          validates every seeded case (collisions AND edge cases) on disk via
          testdata/check_collisions.ps1 -- identical-file integrity, conflict winners,
          Target-only / same-folder preservation, and whether each edge case migrated.
          Fails only on data loss/corruption. Add expected_conflict_winner: source|target
          to assert who wins a conflict, or require_migrated: true to fail on a dropped
          source-only file.
      - at: migrationDone
        do: transfer_more_data
      - at: welcome
        timeout: 180
        done: true
  source:
    defaults: {step_timeout: 300, tick: 0.5}
    policies: {base: happy_path}
    setup: [start_benchmark]
    teardown: [clean_test_data, stop_benchmark_report]
    steps:
      - at: welcome
        env: seed_source_data
        args: {profile: Standard, big_file_mb: 10240, script_timeout: 7200}
        timeout: 7200
        note: >
          lay down the Source's data to be migrated (edge + permission cases included).
          big_file_mb: 10240 generates a 10 GB file (needs ~11 GB free on the Videos drive,
          or the seed script skips it). Add include_locked: true for a genuinely in-use file.
      - at: welcome
        env: publish_source_manifest
        note: >
          publish the seeding manifest (with each permission file's captured security state)
          so the Target's check_permissions step can fetch it -- no manual file copy needed.
      - at: welcome
        do: lets_get_started
        timeout: 120
      - at: pairingCode
        do: publish_code
        args: {timeout: 600}
        timeout: 900
      - at: [linkedSuccess, readyToMigrate]
        timeout: 300
      - at: migrating
        do: announce
        timeout: 1800
      - at: [migrationComplete, migrationPartialSummary, migrationPartialTryAgain, migrationError, cancelledByOtherPc]
        do: wait_for_peer
        args: {state: [finished, failed], timeout: 21600}
        timeout: 21660
        note: keep the Source app open until the Target script has ended (up to 6h for a large transfer)
      - at: [migrationComplete, migrationPartialSummary, migrationPartialTryAgain, migrationError, cancelledByOtherPc]
        do: close_app
        timeout: 21600
        done: true
