name: full_transfer
description: >
  Sign in, pair, transfer everything, then walk the whole results family: summary ->
  details -> (one Retry round when files were skipped) -> back -> Finish -> Migration
  Done (PDF, validator, feedback, Erase your old PC) -> Back to Home. When the outcome
  is still partial, the Source clicks Try Again and the whole migration runs a second
  time from Welcome, ending the same way. Covers TARGET_STATE_MACHINE.md screens 1.2,
  1.4, 1.6-1.16.
launch: exe
roles:
  target:
    defaults: {step_timeout: 300, tick: 0.5}
    policies: {base: happy_path}
    steps:
      - at: [welcome, welcomeSignedOut]
        do: continue
        timeout: 120
      - at: signIn
        do: sign_in
        optional: true
        timeout: 300
        note: skipped when a cached login takes the app straight to checkPrerequisites; UAC must be approved by hand
      - at: connectOldPc
        do: publish
        args: {value: connectOldPc}
        optional: true
        timeout: 900
        note: skipped when the Source is already searching and the app jumps straight to enterCode (seen live 2026-10-20)
      - at: enterCode
        do: type_code
        args: {timeout: 600, attempts: 5, confirm_timeout: 30}
        timeout: 900
        note: waits for the Source script to publish the code
      - at: chooseWhatToMove
        do: migrate_now
        timeout: 600
      - at: migrating
        do: publish
        args: {value: migrating}
        timeout: 180
      - at: resultsSummary
        timeout: 7200
      - at: resultsSummary
        do: view_details
      - at: [complete, skippedFiles]
        timeout: 120
        note: complete when nothing was skipped, skippedFiles otherwise (confirmed live 2026-10-19 -- both happen)
      - at: skippedFiles
        do: retry_if_offered
        optional: true
        timeout: 120
        note: >
          one retry round for the skipped items: clicks Retry when the card offers it (the card reads
          Finish instead after a cancelled run / lost network -- then nothing happens here). Skipped on
          the complete branch.
      - at: migrating
        do: publish
        args: {value: retrying}
        timeout: 180
        note: tells the Source script a second transfer round is running; skipped when there was nothing to retry
      - at: resultsSummary
        optional: true
        timeout: 7200
      - at: resultsSummary
        do: view_details
        optional: true
      - at: [complete, skippedFiles]
        optional: true
        timeout: 120
        note: the retry round's outcome -- whatever is still skipped is reported, not retried again
      - at: skippedFiles
        do: publish
        args: {key: target_outcome, value: partial}
        optional: true
        note: the outcome both role scripts branch on below (skipped on the complete branch)
      - at: complete
        do: publish
        args: {key: target_outcome, value: clean}
        optional: true
      - at: complete
        do: open_pdf
        optional: true
      - at: complete
        do: back_to_summary
        optional: true
      - at: resultsSummary
        do: finish
        optional: true
      - at: skippedFiles
        do: go_to_summary
        optional: true
        note: >
          after the retry round the header link "Go to summary" calls the same finish channel as the
          Finish card and goes straight to Migration Done (confirmed live 2026-10-20: the card still read
          Retry, Finish was not on screen)
      - at: migrationDone
        do: download_pdf
      - at: migrationDone
        env: validate_migration_report
        note: validation/validate_migration.py against the newest MigrationReport PDF -- fails the run on a mismatch
      - at: migrationDone
        do: tell_us_how_we_did
      - at: feedbackModal
        do: submit
        args: {rating: 5, comment: Automated full_transfer run}
      - at: migrationDone
        do: erase_old_pc
      - at: learnAboutErase
        do: back_to_home
        note: >
          Back to Home sends Migration.Stop (MigrationDonePageViewModel.GoHome) -- that is what switches the
          Source to its final screen, the one with Try Again after a partial run
      - at: welcome
        timeout: 180
      - when: {key: target_outcome, is: partial, among: [partial, clean]}
        note: second migration after a partial outcome
        steps:
          - at: [welcome, welcomeSignedOut]
            do: continue
            timeout: 120
            note: the Source clicks Try Again and comes back to its Welcome; the whole migration runs again from here
          - at: signIn
            do: sign_in
            optional: true
            timeout: 300
          - at: connectOldPc
            do: publish
            args: {value: connectOldPc}
            optional: true
            timeout: 900
          - at: enterCode
            do: type_code
            args: {timeout: 900, attempts: 5, confirm_timeout: 30}
            timeout: 1200
            note: the Source needs ~30 s for its engine restart, then Let's get started, before it publishes a code
          - at: chooseWhatToMove
            do: migrate_now
            timeout: 600
          - at: migrating
            do: publish
            args: {value: migrating}
            timeout: 180
          - at: resultsSummary
            timeout: 7200
          - at: resultsSummary
            do: view_details
          - at: [complete, skippedFiles]
            timeout: 120
            note: no further retry -- whatever is still skipped after the second migration is reported
          - at: complete
            do: open_pdf
            optional: true
          - at: complete
            do: back_to_summary
            optional: true
          - at: resultsSummary
            do: finish
            optional: true
          - at: skippedFiles
            do: go_to_summary
            optional: true
          - at: migrationDone
            do: download_pdf
          - at: migrationDone
            env: validate_migration_report
          - at: migrationDone
            do: tell_us_how_we_did
          - at: feedbackModal
            do: submit
            args: {rating: 5, comment: Automated full_transfer run (second migration)}
          - at: migrationDone
            do: erase_old_pc
          - at: learnAboutErase
            do: back_to_home
      - at: welcome
        timeout: 180
        done: true
  source:
    defaults: {step_timeout: 300, tick: 0.5}
    policies: {base: happy_path}
    steps:
      - at: welcome
        do: lets_get_started
        timeout: 120
      - at: pairingCode
        do: publish_code
        args: {timeout: 600}
        timeout: 900
      - at: [linkedSuccess, readyToMigrate]
        timeout: 300
      - at: migrating
        do: announce
        timeout: 1800
      - at: [migrationComplete, migrationPartialSummary, migrationPartialTryAgain, migrationError, cancelledByOtherPc]
        do: announce
        timeout: 7200
        note: any ending (confirmed live 2026-10-19 -- a partial migration lands on migrationPartialSummary)
      - at: [migrationComplete, migrationPartialSummary, migrationPartialTryAgain, migrationError, cancelledByOtherPc]
        do: wait_for_peer
        args: {key: target_outcome, state: [partial, clean], timeout: 7200}
        timeout: 7260
        note: >
          the Target's outcome after its one Retry round (the retry restarts the transfer on this side
          meanwhile: summary -> migrating -> summary); partial means the Source will be asked to Try Again
      - when: {key: target_outcome, is: partial, among: [partial, clean]}
        note: second migration after a partial outcome
        steps:
          - at: migrationPartialTryAgain
            do: try_again
            timeout: 3600
            note: >
              the screen reads Close until the Target has finished its retried migration, then Try Again
              (confirmed live 2026-10-20). Try Again restarts the engine and goes to "We're searching for
              your new PC"; the pairing code appears once the Target has clicked the blue arrow on its home
              screen and reached the code screen
          - at: welcome
            do: lets_get_started
            optional: true
            timeout: 300
            note: only if the restart lands on Welcome instead (the code path allows it); skipped when the searching / code screen shows
          - at: pairingCode
            do: publish_code
            args: {timeout: 900}
            timeout: 1200
          - at: [linkedSuccess, readyToMigrate]
            timeout: 300
          - at: migrating
            do: announce
            timeout: 1800
          - at: [migrationComplete, migrationPartialSummary, migrationPartialTryAgain, migrationError, cancelledByOtherPc]
            do: announce
            timeout: 7200
      - at: [migrationComplete, migrationPartialSummary, migrationPartialTryAgain, migrationError, cancelledByOtherPc]
        do: wait_for_peer
        args: {state: [finished, failed], timeout: 7200}
        timeout: 7260
        note: keep the Source app open until the Target script has ended
      - at: [migrationComplete, migrationPartialSummary, migrationPartialTryAgain, migrationError, cancelledByOtherPc]
        do: close_app
        done: true
